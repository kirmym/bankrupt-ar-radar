[project]
name = "ar-radar"
version = "0.1.0"
description = "Bankrupt AR Radar — радар дебиторской задолженности"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "AR Radar Team"}]

dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # DB
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    # Parsing
    "httpx>=0.27.0",
    "selectolax>=0.3.23",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    # Workers (the current deployment uses asyncio tasks in the API process)
    # CLI
    "typer>=0.12.0",
    "rich>=13.0.0",
    # Telegtam
    "aiogram>=3.13.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "pre-commit>=4.0.0",
    "hatchling>=1.25.0",
]

[project.scripts]
ar-radar = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "DTZ", "T10", "ISC"]
ignore = [
    "E501",
    # Локальные даты (деньги/давность считаются по календарю РФ, не по UTC-инстанту)
    "DTZ007",
    "DTZ011",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
