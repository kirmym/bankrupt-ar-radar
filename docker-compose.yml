# Локальный запуск одного контейнера (как на Railway) + БД.
# Полный многосервисный стек больше не нужен: воркеры живут в процессе API.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ar_radar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ar_radar
      APP_ENV: development
      LOG_LEVEL: INFO
      ENABLE_WORKERS: "true"
      ENABLE_BOT: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
