[project]
name = "ar-radar-bot"
version = "0.1.0"
description = "Telegram bot для AR Radar"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
]

[project.scripts]
ar-radar-bot = "src.bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
