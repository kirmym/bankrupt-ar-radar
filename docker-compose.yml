# Локальный запуск одного контейнера (как на Railway) + БД.
# Полный многосервисный стек больше не нужен: воркеры живут в процессе API.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ar_radar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ar_radar
      APP_ENV: development
      LOG_LEVEL: INFO
      ENABLE_WORKERS: "true"
      ENABLE_BOT: "false"
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      CLOAKBROWSER_CDP_URL: ${CLOAKBROWSER_CDP_URL:-}
      CLOAKBROWSER_PROXY_URL: ${CLOAKBROWSER_PROXY_URL:-}
      CLOAKBROWSER_TIMEOUT_SECONDS: ${CLOAKBROWSER_TIMEOUT_SECONDS:-90}
      CLOAKBROWSER_WAIT_SECONDS: ${CLOAKBROWSER_WAIT_SECONDS:-8}
      CLOAKBROWSER_MIN_INTERVAL_SECONDS: ${CLOAKBROWSER_MIN_INTERVAL_SECONDS:-2}
      FSSP_API_URL: ${FSSP_API_URL:-https://api-ip.fssprus.ru}
      FSSP_API_TOKEN: ${FSSP_API_TOKEN:-}
      FREE_API_SOURCES: ${FREE_API_SOURCES:-}
      EGRUL_EXTRACT_ENABLED: ${EGRUL_EXTRACT_ENABLED:-true}
      EGRUL_EXTRACT_TIMEOUT_SECONDS: ${EGRUL_EXTRACT_TIMEOUT_SECONDS:-30}
      EGRUL_EXTRACT_POLL_SECONDS: ${EGRUL_EXTRACT_POLL_SECONDS:-0.5}
      EGRUL_EXTRACT_MAX_POLLS: ${EGRUL_EXTRACT_MAX_POLLS:-8}
      # Optional HTTP(S) proxy for public source requests. Leave empty by
      # default; Telegram/OpenAI clients are intentionally not routed here.
      SOURCE_PROXY_URL: ${SOURCE_PROXY_URL:-}
      INGEST_SOURCES: ${INGEST_SOURCES:-cdt}
      CDT_API_URL: ${CDT_API_URL:-https://webapi.torgi.cdtrf.ru}
      CDT_INGEST_MAX_ITEMS: ${CDT_INGEST_MAX_ITEMS:-0}
      INGEST_MAX_PAGES: ${INGEST_MAX_PAGES:-10}
      INGEST_PAGE_SIZE: ${INGEST_PAGE_SIZE:-50}
      FILES_BATCH_SIZE: ${FILES_BATCH_SIZE:-20}
      FILES_DOCUMENT_TIMEOUT_SECONDS: ${FILES_DOCUMENT_TIMEOUT_SECONDS:-120}
      FILES_BATCH_TIMEOUT_SECONDS: ${FILES_BATCH_TIMEOUT_SECONDS:-300}
      PROTOTYPE_FILES_CYCLES: ${PROTOTYPE_FILES_CYCLES:-10}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
